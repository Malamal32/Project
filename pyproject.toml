[project]
name = "hiring-db-pipeline"
version = "0.1.0"
description = "US-scoped pipeline mapping college majors (CIP) to job postings, credentials, and skills"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    # Used by the pipeline collectors (`pipeline/politeness.py`). httpx 2.x ships
    # as a *separate distribution* named `httpx2`, not as a new major of this
    # one, so the two install side by side: anthropic pulls `httpx2` and the
    # collectors keep importing `httpx`. The old `<1` pin assumed a conflict
    # that the split package name means does not exist.
    "httpx>=0.27",
    "tenacity>=8.2",
    "typer>=0.12",
    "structlog>=24.1",
    "python-dotenv>=1.2.2",
    "openpyxl>=3.1.5",
    # R2 (S3-compatible) client for raw_documents payload bodies. The pipeline falls
    # back to an on-disk store when R2 credentials are absent, so this is only
    # exercised in production runs.
    "boto3>=1.34",

    # --- Transcript extraction service (service/) -----------------------------
    # 1.x, on httpx 2. This is also the version Cloudflare's Python Workers
    # resolve for the deployed Worker, so local and edge run the same SDK — the
    # service modules are shared between them and cannot straddle two majors.
    "anthropic>=1,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Multipart upload parsing for POST /api/transcript/parse.
    "python-multipart>=0.0.9",
    # PDF -> Markdown/text. The [pdf] extra pulls the converter; the bare package
    # no longer ships it.
    "markitdown[pdf]>=0.1.7",
    # Upload validation only: magic bytes, encryption, page count. Never used to
    # build a filesystem path from a user-supplied name.
    "pypdf>=4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # The service modules are async (Cloudflare Workers only support async HTTP
    # clients), so their tests are too. `asyncio_mode = "auto"` below means an
    # `async def test_*` needs no decorator.
    "pytest-asyncio>=0.24",
    # Builds the synthetic transcript PDFs the service tests run against, so no
    # real student document is ever checked into the repo.
    "reportlab>=4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# This repo's suite lives in tests/. Scoping collection keeps `uv run pytest` from
# picking up unrelated test files that happen to sit in the working tree.
testpaths = ["tests"]
