services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      # The pipeline's working database is a local SQLite file; the published
      # database is Cloudflare D1. There is no database service to run here.
      DATABASE_URL: sqlite+pysqlite:///./data/hiring_db.sqlite3
