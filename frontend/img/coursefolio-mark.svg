<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Coursefolio">
  <title>Coursefolio</title>
  <!-- Cap base, drawn first so the board's white keyline overlaps it. -->
  <path fill="#12a3a0" d="M15.5 27.6 31 35.4 46.5 27.6 v13.9 c0 1-.6 2-1.6 2.4 -4 1.7-8.6 2.6-13.9 2.6 s-9.9-.9-13.9-2.6 A2.6 2.6 0 0 1 15.5 41.5 Z"/>
  <!-- Board. The white stroke is the gap the logo keeps between board and base. -->
  <path fill="#14305e" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round"
        d="M29.8 12.6a4 4 0 0 1 4.4 0l24.4 8.1a1.4 1.4 0 0 1 0 2.6l-24.4 8.1a4 4 0 0 1-4.4 0L5.4 23.3a1.4 1.4 0 0 1 0-2.6Z"/>
  <!-- Tassel: cord out of the board's centre, bead, and the check it ends in.
       Stroked white throughout so it stays legible over both navy and teal. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 22.5h9.5a2.5 2.5 0 0 1 2.5 2.5v9"/>
  </g>
  <circle cx="32" cy="22.5" r="3.4" fill="#ffffff"/>
  <circle cx="44" cy="36.4" r="3.6" fill="#12a3a0" stroke="#ffffff" stroke-width="2.2"/>
  <path fill="#12a3a0" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"
        d="M38.6 42.4h10.8a2.6 2.6 0 0 1 2.6 2.6v8.2a2.6 2.6 0 0 1-2.6 2.6H38.6A2.6 2.6 0 0 1 36 53.2V45a2.6 2.6 0 0 1 2.6-2.6Z"/>
  <path fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
        d="m39.6 48.9 3 3 5-5.6"/>
</svg>
